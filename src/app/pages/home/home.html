<section>
    <h2>Top 3: Las más vendidas</h2>

    <div class="peliculas-grid">
        @for (pelicula of topPeliculas(); track pelicula.id) {
        <article class="pelicula-card">
            <img [src]="pelicula.imagen" [alt]="pelicula.titulo">
            <div class="pelicula-info">
                <h3>{{ pelicula.titulo }}</h3>
                <p><strong>Formato:</strong> {{ pelicula.formato.join(', ') }}</p>
                <p><strong>Idioma:</strong> {{ pelicula.idioma }}</p>
                <button [routerLink]="['/pelicula', pelicula.id]">Ver Funciones</button>
            </div>
        </article>
        } @empty {
        <p>No hay películas destacadas en este momento.</p>
        }
    </div>
</section>
